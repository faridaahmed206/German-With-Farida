<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>German with Farida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7ff;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .login {
            background: #6c63ff;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero p {
            font-size: 20px;
        }

        .start {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .levels {
            padding: 30px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .card h3 {
            font-size: 28px;
        }

        .card button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .card a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🇩🇪 German with Farida</div>
        <a href="login.html">تسجيل الدخول</a>
    </header>

    <section class="hero">
        <h1>تعلمي الألمانية بسهولة 🇩🇪</h1>

        <p>
            دروس • تدريبات • اختبارات • متابعة مستواك
        </p>

        <button class="start">🚀 ابدئي التعلم</button>
    </section>

    <section class="levels">

        <h2>📚 اختاري مستواك</h2>

        <div class="cards">

            <!-- A1 -->
            <div class="card">
                <h3>🟢 A1</h3>
                <p>المستوى المبتدئ</p>

                <a href="a1.html">
                    <button>ابدئي</button>
                </a>
            </div>

            <!-- A2 -->
            <div class="card">
                <h3>🔵 A2</h3>
                <p>المستوى الأساسي</p>

                <a href="A2.html">
                    <button>ابدئي</button>
                </a>
            </div>

            <!-- B1 -->
            <div class="card">
                <h3>🟠 B1</h3>
                <p>المستوى المتوسط</p>

                <a href="B1.html">
                    <button>ابدئي</button>
                </a>
            </div>

        </div>

    </section>

</body>

</html>
