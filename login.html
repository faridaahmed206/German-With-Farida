<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>إنشاء حساب / sign up - German with Farida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-box h1 {
            color: #6c63ff;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .auth-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .auth-box button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
        }

        .auth-box button:hover {
            background: #574bde;
        }

        .toggle-link {
            display: block;
            margin-top: 15px;
            color: #6c63ff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        #message {
            margin-top: 10px;
            font-size: 14px;
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <h1>German with Farida 🇩🇪</h1>

        <!-- نموذج إنشاء حساب جديد -->
        <div id="signup-section">
            <p>أنشئي حسابك الجديد لحفظ تقدمك ودراستك</p>
            <form id="signup-form">
                <input type="text" id="signup-name" placeholder="الاسم الكامل" required>
                <input type="password" id="signup-password" placeholder="كلمة المرور" required>
                <button type="submit">إنشاء حساب (Sign Up)</button>
            </form>
            <span class="toggle-link" onclick="toggleAuth('login')">لديك حساب بالفعل؟ تسجيل الدخول</span>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="login-section" class="hidden">
            <p style="font-size: 18px; font-weight: bold; color: #6c63ff;">تسجيل الدخول</p>
            <form id="login-form">
                <input type="text" id="login-name" placeholder="الاسم" required>
                <input type="password" id="login-password" placeholder="كلمة المرور" required>
                <button type="submit">دخول</button>
            </form>
            <span class="toggle-link" onclick="toggleAuth('signup')">ليس لديك حساب؟ إنشاء حساب جديد</span>
        </div>

        <div id="message"></div>

        <a class="back" href="index.html">← العودة للصفحة الرئيسية</a>

    </div>

    <script>
        // التبديل بين الواجهات
        function toggleAuth(mode) {
            const signupSec = document.getElementById('signup-section');
            const loginSec = document.getElementById('login-section');
            const msg = document.getElementById('message');
            msg.innerText = '';

            if (mode === 'login') {
                signupSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
            } else {
                loginSec.classList.add('hidden');
                signupSec.classList.remove('hidden');
            }
        }

        // معالجة إنشاء الحساب
        document.getElementById('signup-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const password = document.getElementById('signup-password').value;

            // حفظ بيانات المستخدم في LocalStorage
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_password', password);
            localStorage.setItem('is_logged_in', 'true');

            alert('تم إنشاء الحساب بنجاح! سيتم تحويلك الآن للصفحة الرئيسية.');
            window.location.href = 'index.html';
        });

        // معالجة تسجيل الدخول
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value;
            const password = document.getElementById('login-password').value;

            const savedName = localStorage.getItem('user_name');
            const savedPassword = localStorage.getItem('user_password');

            if (name === savedName && password === savedPassword) {
                localStorage.setItem('is_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('message').innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
            }
        });
    </script>

</body>

</html>
