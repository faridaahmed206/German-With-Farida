<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - German with Farida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px #ddd;
            text-align: center;
        }

        .login-box h1 {
            color: #6c63ff;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
        }

        .login-box input {
            width: 90%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .login-box button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #6c63ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>German with Farida 🇩🇪</h1>

        <p>سجلي دخولك للبدء في التعلم</p>

        <input type="text" placeholder="اسم المستخدم">

        <input type="password" placeholder="كلمة المرور">

        <button>تسجيل الدخول</button>

        <a class="back" href="index.html">← العودة للصفحة الرئيسية</a>

    </div>

</body>

</html>
